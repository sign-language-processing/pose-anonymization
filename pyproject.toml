[project]
name = "pose-anonymization"
description = "Remove identifying information from sign language poses"
version = "0.0.1"
authors = [
    { name = "Amit Moryossef", email = "amitmoryossef@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pose-format",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "matplotlib",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "C90",  # mccabe complexity
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "PT",   # flake8-pytest-style
    "W605", # invalid escape sequence
    "BLE",  # flake8-blind-except
]

[tool.setuptools]
packages = [
    "pose_anonymization",
    "pose_anonymization.data",
]

[tool.setuptools.package-data]
pose_anonymization = ["**/*.json", "**/*.poseheader"]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["pose_anonymization", "tests"]

[project.scripts]
anonymize_pose = "pose_anonymization.bin:main"
